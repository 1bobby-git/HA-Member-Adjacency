name: Isolated optimization source audit
on:
  push:
    branches: [optimization/2026-09-safe]
    paths: [.github/workflows/optimization-audit.yml]
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Snapshot public source revisions (no credentials or user data)
        shell: bash
        run: |
          set -euo pipefail
          mkdir sources
          for repo in HA-iOS-ANCS HA-SmartThings-Find HA-YTMusic-URL-Player HA-Seoul-Bike HA-Member-Adjacency HA-Kepco-Meter; do
            git clone --depth 1 "https://github.com/1bobby-git/${repo}.git" "checkout/${repo}"
            git -C "checkout/${repo}" archive --format=tar.gz --prefix="${repo}/" HEAD > "sources/${repo}.tar.gz"
            git -C "checkout/${repo}" log -1 --format='%H%n%T%n%s' > "sources/${repo}.revision.txt"
          done
          sha256sum sources/*.tar.gz > sources/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ha-six-source-audit
          path: sources/
          retention-days: 3
          if-no-files-found: error
