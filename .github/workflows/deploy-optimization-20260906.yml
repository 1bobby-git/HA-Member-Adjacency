name: Deploy optimization 20260906
on:
  push:
    branches: [release/optimization-20260906]
    paths: [.github/workflows/deploy-optimization-20260906.yml]
permissions:
  contents: write
concurrency:
  group: deploy-optimization-20260906
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: 1bobby-git/HA-iOS-ANCS
          ref: d5c58703029ea8cfbff4cfd335c59fc49d3fbe98
          path: .release-helper
          sparse-checkout: .optimization-release
          persist-credentials: false
      - name: Load approved patches and correct draft lookup
        run: |
          python - <<'PY'
          import json, os, re, shutil, subprocess
          from pathlib import Path
          original = subprocess.check_output(['git', 'show', '525231ccf3d87d8382139c40bd61fc39b2d89af6:.github/workflows/deploy-optimization-20260906.yml'], text=True)
          spec = json.loads(re.search(r'PATCH_SPEC: >-\s+(\{[^\n]+\})', original).group(1))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PATCH_SPEC=' + json.dumps(spec, ensure_ascii=False) + '\n')
          temp = Path(os.environ['RUNNER_TEMP'])
          source = Path('.release-helper/.optimization-release')
          text = (source/'deploy.py').read_text()
          old = '    release = api("releases/tags/" + state["tag"])'
          assert text.count(old) == 2
          text = text.replace(old, '    release = next(r for r in api("releases?per_page=100") if r["tag_name"] == state["tag"])', 1)
          (temp/'optimization-deploy.py').write_text(text)
          shutil.copyfile(source/'unittest_report.py', temp/'optimization-unittest.py')
          shutil.rmtree('.release-helper')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source hashes, version and branch protections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python "$RUNNER_TEMP/optimization-deploy.py" check
      - name: Test unchanged baseline
        run: |
          python -m compileall -q custom_components/member_adjacency
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/optimization-unittest.py" . "$RUNNER_TEMP/optimization-baseline.xml"
          python scripts/check_release_alignment.py v1.6.4
      - name: Apply exact source patches and update documentation
        run: python "$RUNNER_TEMP/optimization-deploy.py" apply
      - name: Align native release contracts without changing visibility or options tests
        run: |
          python - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path
          changes = {
              'tests/test_release_alignment.py': ('e1c504ccf4e6849c6a9d061a9322ee07be85aa9f', 'CURRENT_VERSION = "1.6.4"', 'CURRENT_VERSION = "1.6.5"'),
              'tests/test_integration_visibility.py': ('2271db20bfa2b5e89666016cfc6b7e9d61d9c376', 'self.assertEqual("1.6.4", manifest["version"])', 'self.assertEqual("1.6.5", manifest["version"])'),
          }
          state_path = Path(os.environ['RUNNER_TEMP'])/'optimization-state.json'
          state = json.loads(state_path.read_text())
          for name, (expected, old, new) in changes.items():
              p = Path(name)
              raw = p.read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == expected
              text = raw.decode()
              assert text.count(old) == 1
              text = text.replace(old, new)
              ast.parse(text)
              p.write_text(text)
              state['paths'].append(name)
          state['paths'] = sorted(set(state['paths']))
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Test complete patched integration and release alignment
        run: |
          python -m compileall -q custom_components/member_adjacency
          PYTHONPATH="$PWD" python "$RUNNER_TEMP/optimization-unittest.py" . "$RUNNER_TEMP/optimization-patched.xml"
          python scripts/check_release_alignment.py v1.6.5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
      - name: Publish verified commit, tag and release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python "$RUNNER_TEMP/optimization-deploy.py" publish
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-validation
          path: |
            ${{ runner.temp }}/optimization-baseline.xml
            ${{ runner.temp }}/optimization-patched.xml
            ${{ runner.temp }}/optimization-result.json
          if-no-files-found: ignore
