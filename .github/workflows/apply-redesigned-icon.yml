name: Apply redesigned Member Adjacency icon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-redesigned-icon.yml

permissions:
  contents: write

concurrency:
  group: apply-redesigned-member-adjacency-icon
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BRAND_COMMIT: 4682db180f6fa4451b17d49bbb883d111401ffa2
      RELEASE_VERSION: 1.6.2
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare latest branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B redesigned-icon-release origin/main

      - name: Install image validation tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Apply local brand assets and release metadata
        shell: bash
        run: |
          set -euo pipefail
          source_base="https://raw.githubusercontent.com/1bobby-git/brands/${BRAND_COMMIT}/custom_integrations/member_adjacency"
          target="custom_components/member_adjacency/brand"
          mkdir -p "${target}"

          for name in icon.png icon@2x.png dark_icon.png dark_icon@2x.png; do
            curl --fail --location --retry 3 --retry-delay 2 \
              "${source_base}/${name}" \
              --output "${target}/${name}"
          done

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          version = "1.6.2"
          expected = {
              "icon.png": (256, 256),
              "dark_icon.png": (256, 256),
              "icon@2x.png": (512, 512),
              "dark_icon@2x.png": (512, 512),
          }
          brand = Path("custom_components/member_adjacency/brand")
          for name, size in expected.items():
              image = Image.open(brand / name).convert("RGBA")
              if image.size != size:
                  raise SystemExit(f"Unexpected size for {name}: {image.size}")
              if image.getchannel("A").getextrema() != (0, 255):
                  raise SystemExit(f"Missing transparency in {name}")

          manifest_path = Path("custom_components/member_adjacency/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != "1.6.1":
              raise SystemExit(f"Unexpected previous manifest version: {manifest.get('version')}")
          manifest["version"] = version
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          test_path = Path("tests/test_release_alignment.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_test = 'CURRENT_VERSION = "1.6.1"'
          new_test = f'CURRENT_VERSION = "{version}"'
          if old_test not in test_text:
              raise SystemExit("Release-alignment test version marker was not found")
          test_path.write_text(test_text.replace(old_test, new_test, 1), encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          heading = "# 변경 이력\n\n"
          entry = (
              "## 1.6.2 - 2026-09-02\n\n"
              "- 두 위치 엔티티를 사람형 위치 핀, 거리 연결선, 근접 신호로 표현한 새 기본 아이콘으로 교체했습니다.\n"
              "- 파랑·청록·보라 그라데이션과 굵은 실루엣을 사용해 Home Assistant의 32px 축소 화면에서도 의미가 구분되도록 개선했습니다.\n"
              "- 라이트·다크 테마용 256px 및 512px 투명 PNG를 통합 패키지 내부 로컬 브랜드 자산으로 포함했습니다.\n"
              "- 센서 계산, 엔티티 ID, 자동화 이벤트 및 설정 동작은 변경하지 않았습니다.\n\n"
          )
          if heading not in changelog:
              raise SystemExit("Changelog heading was not found")
          if entry not in changelog:
              changelog = changelog.replace(heading, heading + entry, 1)
              changelog_path.write_text(changelog, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old = (
              '  <img src="https://raw.githubusercontent.com/1bobby-git/brands/master/'
              'custom_integrations/member_adjacency/logo.png" alt="인접센서 로고" width="240">'
          )
          new = (
              '  <img src="https://raw.githubusercontent.com/1bobby-git/brands/'
              '4682db180f6fa4451b17d49bbb883d111401ffa2/'
              'custom_integrations/member_adjacency/icon@2x.png" '
              'alt="인접센서 아이콘" width="180">'
          )
          if old not in readme:
              raise SystemExit("README branding image marker was not found")
          readme_path.write_text(readme.replace(old, new, 1), encoding="utf-8")
          PY

          git diff --check
          python -m unittest discover

      - name: Commit, tag, and publish v1.6.2
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-redesigned-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign Member Adjacency icon for 1.6.2"
          release_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main

          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi
          git tag -a "${tag}" -m "Member Adjacency ${tag}"
          git push origin "${tag}"

          gh release create "${tag}" \
            --verify-tag \
            --title "Member Adjacency ${tag}" \
            --notes "- 인접센서의 기본 아이콘을 두 사람형 위치 핀과 근접 신호를 결합한 새 디자인으로 교체했습니다.
- 라이트·다크 테마용 256px·512px 투명 PNG를 통합 패키지 내부에 포함했습니다.
- 32px 축소 표시에서도 두 위치와 근접 관계가 구분되도록 대비와 실루엣을 개선했습니다.
- 센서 계산, 엔티티 ID, 이벤트 및 설정 동작은 변경하지 않았습니다."

          echo "Published ${tag} from ${release_sha}."
