name: Publish v1.6.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.6.4.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release target
        run: |
          test "$(git show 0bae5e4e0034c0c28f29743b8f92ad9a4ec10778:custom_components/member_adjacency/manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "1.6.4"
          python -m unittest discover -v
          python scripts/check_release_alignment.py v1.6.4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.6.4 >/dev/null 2>&1; then
            echo "v1.6.4 already exists"
            exit 0
          fi
          gh release create v1.6.4 \
            --target 0bae5e4e0034c0c28f29743b8f92ad9a4ec10778 \
            --title "v1.6.4" \
            --notes "Home Assistant 2026.9 통합 구성 요소 목록 노출을 복원하고 기존 OptionsFlow 기반 설정 편집·저장·reload 동작을 유지합니다. 기존 config entry, 기기 및 5개 엔티티의 식별자는 변경하지 않습니다."
