name: Probe Home Assistant MCP once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-ha-mcp-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      MCP_URL: https://mcp-homeassistant.toiss.kr/mcp
      MCP_TOKEN: ${{ secrets.HA_MCP_TOKEN || secrets.MCP_TOKEN || secrets.MCP_BEARER_TOKEN || secrets.STATIC_BEARER_TOKEN }}
      OAUTH_PASSWORD_PRESENT: ${{ (secrets.HA_MCP_OAUTH_PASSWORD != '') || (secrets.OAUTH_ADMIN_PASSWORD != '') || (secrets.MCP_ADMIN_PASSWORD != '') }}
    steps:
      - name: Probe endpoint and authentication
        shell: bash
        run: |
          set -euo pipefail
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ha-member-adjacency-probe","version":"1.6.4"}}}'
          health_code="$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' https://mcp-homeassistant.toiss.kr/healthz || true)"
          ready_code="$(curl -sS --max-time 20 -o /tmp/ready.json -w '%{http_code}' https://mcp-homeassistant.toiss.kr/readyz || true)"
          oauth_code="$(curl -sS --max-time 20 -o /tmp/oauth.json -w '%{http_code}' https://mcp-homeassistant.toiss.kr/.well-known/oauth-authorization-server || true)"
          noauth_code="$(curl -sS --max-time 20 -o /tmp/noauth.json -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H 'MCP-Protocol-Version: 2025-11-25' --data "$INIT" "$MCP_URL" || true)"
          token_code="not_attempted"
          if [[ -n "${MCP_TOKEN:-}" ]]; then
            token_code="$(curl -sS --max-time 20 -o /tmp/token.json -w '%{http_code}' -H "Authorization: Bearer $MCP_TOKEN" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H 'MCP-Protocol-Version: 2025-11-25' --data "$INIT" "$MCP_URL" || true)"
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          def safe_json(path):
              try:
                  value = json.loads(Path(path).read_text())
                  if isinstance(value, dict):
                      if "serverInfo" in (value.get("result") or {}):
                          return {"serverInfo": value["result"]["serverInfo"]}
                      return {"keys": sorted(value)[:20]}
              except Exception:
                  pass
              return None
          report = {
              "health_http": os.environ.get("health_code"),
              "ready_http": os.environ.get("ready_code"),
              "oauth_metadata_http": os.environ.get("oauth_code"),
              "mcp_noauth_http": os.environ.get("noauth_code"),
              "mcp_static_token_http": os.environ.get("token_code"),
              "static_token_secret_present": bool(os.environ.get("MCP_TOKEN")),
              "oauth_password_secret_present": os.environ.get("OAUTH_PASSWORD_PRESENT", "false").lower() == "true",
              "noauth_response": safe_json("/tmp/noauth.json"),
              "token_response": safe_json("/tmp/token.json"),
          }
          Path("ha-mcp-probe.json").write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False))
          PY
        env:
          health_code: ${{ env.health_code }}
      - name: Build sanitized report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          # The previous shell variables are not exported across commands, so rebuild only HTTP codes here.
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ha-member-adjacency-probe","version":"1.6.4"}}}'
          def code(args):
              result=subprocess.run(args, text=True, capture_output=True)
              return result.stdout[-3:] if result.stdout else "000"
          common=["curl","-sS","--max-time","20","-o","/dev/null","-w","%{http_code}"]
          report={
              "health_http": code(common+["https://mcp-homeassistant.toiss.kr/healthz"]),
              "ready_http": code(common+["https://mcp-homeassistant.toiss.kr/readyz"]),
              "oauth_metadata_http": code(common+["https://mcp-homeassistant.toiss.kr/.well-known/oauth-authorization-server"]),
              "mcp_noauth_http": code(common+["-H","Content-Type: application/json","-H","Accept: application/json, text/event-stream","-H","MCP-Protocol-Version: 2025-11-25","--data",init,os.environ["MCP_URL"]]),
              "static_token_secret_present": bool(os.environ.get("MCP_TOKEN")),
              "oauth_password_secret_present": os.environ.get("OAUTH_PASSWORD_PRESENT", "false").lower() == "true",
          }
          if os.environ.get("MCP_TOKEN"):
              report["mcp_static_token_http"]=code(common+["-H",f"Authorization: Bearer {os.environ['MCP_TOKEN']}","-H","Content-Type: application/json","-H","Accept: application/json, text/event-stream","-H","MCP-Protocol-Version: 2025-11-25","--data",init,os.environ["MCP_URL"]])
          else:
              report["mcp_static_token_http"]="not_attempted"
          Path("ha-mcp-probe.json").write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False))
          PY
      - name: Upload sanitized probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-mcp-probe
          path: ha-mcp-probe.json
          retention-days: 1
