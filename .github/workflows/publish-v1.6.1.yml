name: Publish Member Adjacency v1.6.1

on:
  push:
    branches:
      - release/v1.6.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 8bf1bfe12e7c2d8cb6f2cda378dfb6eab7623eb3
        run: |
          if gh release view v1.6.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.6.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Member Adjacency v1.6.1" \
            --notes $'- 실제로 변경된 위치 소스만 이동·신뢰도 이력에 반영\n- 거리상 근접과 신뢰 근접 상태 분리\n- 비신뢰 상태에서 정상 상태로 전환될 때 enter 이벤트 복구\n- 잘못된 위치 샘플에서 근접 센서를 unavailable 처리'
